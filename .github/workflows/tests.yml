name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system Python and GTK test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-gi python3-cairo python3-gi-cairo gir1.2-gtk-3.0
      - name: Run isolated test suites (no desktop required)
        run: /usr/bin/python3 tools/test.py --labs
